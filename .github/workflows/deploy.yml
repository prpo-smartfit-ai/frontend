name: Build and Deploy Frontend

on:
  push:
    branches: [ master, main, develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: smartfitregistry99.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: smartfitregistry99.azurecr.io/frontend:latest
          build-args: |
            VITE_USER_SERVICE_URL=http://${{ secrets.VM_IP }}:8081
            VITE_WORKOUT_SERVICE_URL=http://${{ secrets.VM_IP }}:8082
            VITE_AI_SERVICE_URL=http://${{ secrets.VM_IP }}:8083

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Restart Deployment on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo kubectl rollout restart deployment/frontend -n smartfit

